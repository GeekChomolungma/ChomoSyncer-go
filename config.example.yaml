# ==============================================================================
# ChomoSyncer-go 全模块配置示例文件 (config.example.yaml)
# 
# 优先级说明：
# 1. 命令行显式参数 (CLI Flags) / 环境变量 (CHOMOSYNCER_*) 具有最高优先级；
# 2. 配置文件中的参数次之；
# 3. 未配置项自动采用内置的生产级安全默认值。
# ==============================================================================

app:
  log_level: "info"              # 日志等级: debug | info | warn | error
  log_format: "text"             # 日志格式: text | json
  metrics_addr: ":9090"          # Prometheus 监控指标监听地址 ("off" 则关闭)
  shutdown_timeout: 30s          # 进程收到退出信号后的优雅停机最长等待时间

collector:
  intervals:                     # WS 采集周期：本构建只采集 1m 基准 K 线，必须恰为 ["1m"]
    - "1m"
  serve_intervals:               # 由 1m 派生的更粗周期：驱动 ① ClickHouse rollup 表/物化视图
    - "5m"                       #   (deploy/clickhouse/002_kline_rollups.sql) ② dispatcher 的派生 kline_ready 截面信号。
    - "15m"                      # 不为它们建立 WS 订阅或 Go 写入器；只能是 1m 的 Xs/Xm/Xh 整数倍或 1d。
    - "1h"
    - "4h"
    - "1d"
  shards_per_interval: 8         # 1m 基准周期的 WebSocket 分片连接数（哈希均匀打散标的）
  ws_url: "wss://fstream.binance.com" # 币安合约 WebSocket 基地址
  connect_stagger: 300ms         # 多个分片建连错峰等待时间（防止瞬间触发建连频控）
  connect_timeout: 20s           # 单个分片建连最长超时时间
  reconnect_base: 1s             # 断线重连最小退避基础时间
  reconnect_max: 30s             # 断线重连最大退避上限时间
  stale_timeout: 60s             # 看门狗超时：超过该时长无任何消息则强制判定为假死断线重连
  watchdog_interval: 10s         # 看门狗与增量订阅巡检周期

dispatcher:
  closed_workers: 8              # 消费已收盘 K 线的并发 Worker 协程数
  closed_queue_size: 4096        # 已收盘 K 线待处理队列容量（通道缓冲区大小）
  section_timeout: 5s            # 截面对齐兜底超时：首根收盘 Bar 后等待此时间触发 kline_ready
  publish_timeout: 5s            # 发布 kline_ready 的单次最长等待超时

redis:
  addr: "localhost:6379"         # Redis 地址
  db: 0                          # Redis DB 序号
  password: ""                   # Redis 鉴权密码
  pool_size: 32                  # 收盘滑窗专用客户端连接池大小
  dial_timeout: 5s               # 建连超时
  read_timeout: 3s               # 读取超时
  write_timeout: 3s              # 写入超时
  window:
    key_prefix: "kline"          # 滑窗 Key 前缀 (kline:<symbol>:<interval>)
    window_size: 200             # 核心业务参数：每个标的保留在 Redis 滑窗内的最新 Bar 数量
    stream_key: "stream:market:kline_ready" # 截面就绪事件发布的 Redis Stream Key
    stream_maxlen: 10000         # 截面事件 Stream 近似保留的最大消息条数 (MAXLEN ~)
    atomic: false                # 是否开启 MULTI/EXEC 事务包装 LPUSH+LTRIM
  live:
    addr: ""                     # 未收盘实时行情专用的 Redis 地址（留空则复用 redis.addr）
    db: 0                        # Live DB 序号
    password: ""                 # Live Redis 密码
    pool_size: 12                # Live 客户端独立连接池大小（与滑窗隔离，防止争抢连接）
    workers: 4                   # 消费未收盘 Live Bar 并写入 Redis 的 Worker 协程数
    channel_size: 16384          # Live Bar 待写入队列容量（满则丢弃未收盘瞬态数据）
    write_timeout: 200ms         # 写入单次超时
    ttl_multiple: 2              # 过期时间倍数（TTL = ttl_multiple * interval）
    default_ttl: 2h              # 无法解析周期的默认 TTL
    publish: false               # 是否同时将 live bar PUBLISH 到 Pub/Sub
    key_prefix: "livebar"        # Live Bar Hash Key 前缀
    channel_prefix: "livebar"    # Live Bar Pub/Sub 频道前缀

clickhouse:
  addrs:                         # ClickHouse Native 协议连接地址列表
    - "localhost:9000"
  database: "market"             # 数据库名称
  username: "default"            # 用户名
  password: ""                   # 密码
  table_prefix: "market.fapi_kline" # 数据表前缀（物理表为 <prefix>_<interval>）
  dial_timeout: 5s               # 建连超时
  tls: false                     # 是否开启 TLS 加密
  batch_size: 5000               # 强制触发批量落盘的行数阈值
  flush_interval: 2000ms         # 最长攒批等待时间（未满 batch_size 达到此时间也强制落盘）
  channel_size: 20000            # ClickHouse BatchWriter 待落盘队列容量
  max_retries: 5                 # 落盘失败后的最大重试次数
  retry_backoff: 200ms           # 失败重试基础退避时长
  max_retry_backoff: 5s          # 失败重试最大退避上限
  shutdown_timeout: 15s          # 停机时排空落盘队列的最大超时

universe:
  rest_url: "https://fapi.binance.com" # 币安合约 REST API 根地址
  refresh_interval: 24h          # 全市场合约列表刷新周期
  refresh_offset: 2m             # 每日 UTC 00:00 之后偏移对齐时间（避开结算）
  http_timeout: 20s              # 请求 exchangeInfo 单次超时
  quote_assets:                  # 采集的目标计价币种（可配置多个，如 USDT, USDC）
    - "USDT"
  contract_type: "PERPETUAL"     # 合约类型: PERPETUAL (永续)
  status: "TRADING"              # 合约交易状态: TRADING (正常交易中)

backfill:
  enabled: true                  # 是否开启历史回补（冷启动 + 断线重连补洞）
  offline_only: false            # 仅离线回补模式：true = 只把历史 K 线灌入 ClickHouse，跑完即退出，
                                 #   不启动 WS 采集 / dispatcher / Redis 实时链路（"先灌历史再上线"两阶段冷启动的第一阶段）；
                                 #   false = 完整在线业务。此模式下 gate_timeout 自动失效（历史全量拉取必须跑完）。
  cold_start_date: ""            # 空库冷启动同步起点 (例如 "2024-01-01" 或 RFC3339)，留空则回退至最近窗口
  workers: 8                     # 回补时并发 REST 请求抓取的协程数
  rest_rps: 20                   # K 线回补的请求速率上限 (次/秒)。权重预算由下面的 weight_gate 统一管理，二者同时生效
  queue_size: 512                # 回补任务请求队列容量
  gap_debounce: 30s              # 断线重连重复缺口事件合并防抖时长
  gate_timeout: 10m               # 窗口门控最长持有超时（防止回补卡死导致实时数据一直被压制）
  flush_wait: 2s                 # 回补数据 Push 完毕后，若无 writer 时的回退等待时长
  sweep_enabled: true            # 定时完整性回查：兜底 WS 静默重连/丢帧造成的 1m 缺口（在线模式）
  sweep_every: 30m               # 回查周期
  sweep_window: 24h              # 每次回查最近多久的 1m K 线（库内相邻两根之间缺的分钟，用 REST 补）
  sweep_settle: 3m               # 最新这段时间内的 K 线不判定（给实时链路与落盘留出时间）
  sweep_empty_ttl: 12h           # 币安对"该分钟无成交"不返回 K 线；REST 也查不到的缺口记住这么久，不重复请求。建议 >= sweep_window，否则同一个空区间在窗口内会被重复请求 window/ttl 次（仅内存记忆，重启后清空）

weight_gate:                     # /fapi 请求权重闸门：所有 /fapi REST 调用（K 线回补、universe 刷新，之后还有 OI 快照）共用同一个按 IP 计的 2400 权重/分钟
  live_budget: 600               # 时间敏感的快照（OI）预留的权重/分钟；独立预算，不会被回补饿死
  bulk_budget: 1200              # 批量任务（K 线缺口回补）的权重/分钟
  misc_budget: 100               # 杂项（universe 的 exchangeInfo）的权重/分钟。三项之和不得超过 2400，余量留给闸门看不到的同 IP 流量
  soft_limit: 1800               # 币安响应头 X-MBX-USED-WEIGHT-1M 达到此值时，批量任务等到下一分钟再继续
  hard_limit: 2300               # 达到此值时，连 live 与杂项也等到下一分钟

open_interest:                   # 5 分钟持仓量（OI）同步，写入 market.fapi_oi_5m（先执行 deploy/clickhouse/004_fapi_oi.sql）。设计见 new_requirements/oi.md
  hist_enabled: false            # 启动时读库中每个标的已校准到哪根，据此从 openInterestHist 补缺；之后每小时校准一次。建议先只开这个
  live_enabled: false            # 每根 5m K 线收盘前 live_lead 用 /fapi/v1/openInterest 打一轮快照。观察校准指标后再开
  table: "market.fapi_oi_5m"     # 目标表
  live_lead: 30s                 # 在 K 线收盘前多久开始一轮（528 个标的约 21 秒发完）
  live_accept_window: 60s        # 快照时间距最近 5m 边界超过此值则丢弃（必须 < 2m30s）
  live_workers: 8                # live 并发请求数
  fapi_rps: 25                   # live 一轮的请求节奏；/fapi 池的硬限制由 weight_gate 负责
  hist_reconcile_interval: 1h    # 定时校准的周期
  hist_reconcile_offset: 5m      # 每小时 hh:05 开始（标签 hh:00 最晚约 3 分钟可读）
  hist_reconcile_spread: 20m     # 一轮的请求在这段时间内匀速铺开（启动补缺不铺开）
  hist_publish_lag: 4m           # 标签 T 预计在 T 之后多久可读，用来判断“已是最新则跳过”
  hist_limit_margin: 3           # 每次请求比缺口多要几根，容忍个别失败
  hist_max_limit: 500            # 单次请求 limit 上限（币安文档上限 500）；更长的缺口从新往旧分页
  hist_cold_start_window: 48h    # 库里没有任何已校准行的标的，补回多远
  hist_max_backfill: 168h        # 补缺最远回溯多久（币安只保留约 30 天）；更早的缺口需要用归档导入
  hist_workers: 4                # hist 并发拉取的标的数
  data_rps: 2                    # /futures/data 池的请求速率（该池每 IP 每 5 分钟 1000 次）
  data_window_cap: 900           # /futures/data 池 5 分钟滑动窗口的硬上限

