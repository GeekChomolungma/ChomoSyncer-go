# ==============================================================================
# ChomoSyncer-go 全模块配置示例文件 (config.example.yaml)
# 
# 优先级说明：
# 1. 命令行显式参数 (CLI Flags) / 环境变量 (CHOMOSYNCER_*) 具有最高优先级；
# 2. 配置文件中的参数次之；
# 3. 未配置项自动采用内置的生产级安全默认值。
# ==============================================================================

app:
  log_level: "info"              # 日志等级: debug | info | warn | error
  log_format: "text"             # 日志格式: text | json
  metrics_addr: ":9090"          # Prometheus 监控指标监听地址 ("off" 则关闭)
  shutdown_timeout: 30s          # 进程收到退出信号后的优雅停机最长等待时间

collector:
  intervals:                     # 订阅的 K 线周期列表
    - "1m"
    - "1h"
  shards_per_interval: 4         # 每个 K 线周期的 WebSocket 分片连接数（哈希均匀打散标的）
  ws_url: "wss://fstream.binance.com" # 币安合约 WebSocket 基地址
  connect_stagger: 300ms         # 多个分片建连错峰等待时间（防止瞬间触发建连频控）
  connect_timeout: 20s           # 单个分片建连最长超时时间
  reconnect_base: 1s             # 断线重连最小退避基础时间
  reconnect_max: 30s             # 断线重连最大退避上限时间
  stale_timeout: 60s             # 看门狗超时：超过该时长无任何消息则强制判定为假死断线重连
  watchdog_interval: 10s         # 看门狗与增量订阅巡检周期

dispatcher:
  closed_workers: 4              # 消费已收盘 K 线的并发 Worker 协程数
  closed_queue_size: 4096        # 已收盘 K 线待处理队列容量（通道缓冲区大小）
  section_timeout: 5s            # 截面对齐兜底超时：首根收盘 Bar 后等待此时间触发 kline_ready
  publish_timeout: 5s            # 发布 kline_ready 的单次最长等待超时

redis:
  addr: "localhost:6379"         # Redis 地址
  db: 0                          # Redis DB 序号
  password: ""                   # Redis 鉴权密码
  pool_size: 20                  # 收盘滑窗专用客户端连接池大小
  dial_timeout: 5s               # 建连超时
  read_timeout: 3s               # 读取超时
  write_timeout: 3s              # 写入超时
  window:
    key_prefix: "kline"          # 滑窗 Key 前缀 (kline:<symbol>:<interval>)
    window_size: 200             # 核心业务参数：每个标的保留在 Redis 滑窗内的最新 Bar 数量
    stream_key: "stream:market:kline_ready" # 截面就绪事件发布的 Redis Stream Key
    stream_maxlen: 10000         # 截面事件 Stream 近似保留的最大消息条数 (MAXLEN ~)
    atomic: false                # 是否开启 MULTI/EXEC 事务包装 LPUSH+LTRIM
  live:
    addr: ""                     # 未收盘实时行情专用的 Redis 地址（留空则复用 redis.addr）
    db: 0                        # Live DB 序号
    password: ""                 # Live Redis 密码
    pool_size: 8                 # Live 客户端独立连接池大小（与滑窗隔离，防止争抢连接）
    workers: 2                   # 消费未收盘 Live Bar 并写入 Redis 的 Worker 协程数
    channel_size: 8192           # Live Bar 待写入队列容量（满则丢弃未收盘瞬态数据）
    write_timeout: 200ms         # 写入单次超时
    ttl_multiple: 2              # 过期时间倍数（TTL = ttl_multiple * interval）
    default_ttl: 2h              # 无法解析周期的默认 TTL
    publish: false               # 是否同时将 live bar PUBLISH 到 Pub/Sub
    key_prefix: "livebar"        # Live Bar Hash Key 前缀
    channel_prefix: "livebar"    # Live Bar Pub/Sub 频道前缀

clickhouse:
  addrs:                         # ClickHouse Native 协议连接地址列表
    - "localhost:9000"
  database: "market"             # 数据库名称
  username: "default"            # 用户名
  password: ""                   # 密码
  table_prefix: "market.fapi_kline" # 数据表前缀（物理表为 <prefix>_<interval>）
  dial_timeout: 5s               # 建连超时
  tls: false                     # 是否开启 TLS 加密
  batch_size: 5000               # 强制触发批量落盘的行数阈值
  flush_interval: 1000ms         # 最长攒批等待时间（未满 batch_size 达到此时间也强制落盘）
  channel_size: 20000            # ClickHouse BatchWriter 待落盘队列容量
  max_retries: 5                 # 落盘失败后的最大重试次数
  retry_backoff: 200ms           # 失败重试基础退避时长
  max_retry_backoff: 5s          # 失败重试最大退避上限
  shutdown_timeout: 15s          # 停机时排空落盘队列的最大超时

universe:
  rest_url: "https://fapi.binance.com" # 币安合约 REST API 根地址
  refresh_interval: 24h          # 全市场合约列表刷新周期
  refresh_offset: 2m             # 每日 UTC 00:00 之后偏移对齐时间（避开结算）
  http_timeout: 20s              # 请求 exchangeInfo 单次超时
  quote_assets:                  # 采集的目标计价币种（可配置多个，如 USDT, USDC）
    - "USDT"
  contract_type: "PERPETUAL"     # 合约类型: PERPETUAL (永续)
  status: "TRADING"              # 合约交易状态: TRADING (正常交易中)

backfill:
  enabled: true                  # 是否开启历史回补（冷启动 + 断线重连补洞）
  cold_start_date: ""            # 空库冷启动同步起点 (例如 "2024-01-01" 或 RFC3339)，留空则回退至最近窗口
  workers: 4                     # 回补时并发 REST 请求抓取的协程数
  rest_rps: 20                   # 币安 REST API 令牌桶限流速率 (RPS)
  queue_size: 256                # 回补任务请求队列容量
  gap_debounce: 30s              # 断线重连重复缺口事件合并防抖时长
  gate_timeout: 5m               # 窗口门控最长持有超时（防止回补卡死导致实时数据一直被压制）
  flush_wait: 2s                 # 回补数据 Push 完毕后，若无 writer 时的回退等待时长

